<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>📋 BFF 日志查看器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  .toolbar { padding: 10px 14px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar h1 { font-size: 13px; color: #8b949e; font-weight: 600; }
  .toolbar button, .toolbar select, .toolbar input { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .toolbar button:hover { background: #30363d; }
  .toolbar button.active { background: #238636; border-color: #238636; color: #fff; }
  .toolbar input { width: 180px; }
  .seg { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid #30363d; }
  .seg button { border: 0; border-radius: 0; }
  .count { color: #8b949e; font-size: 11px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.live { background: #238636; animation: pulse 1.5s infinite; }
  .dot.off { background: #da3633; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead { background: #161b22; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid #30363d; }
  th { padding: 7px 10px; text-align: left; color: #8b949e; font-weight: 600; }
  td { padding: 5px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
  tbody tr:hover { background: #161b22; }
  tbody tr.new { animation: flash 0.4s; }
  @keyframes flash { from { background: #1f3b2a; } to { background: transparent; } }

  .level { font-weight: 700; padding: 1px 6px; border-radius: 3px; font-size: 10px; display: inline-block; }
  .level-DEBUG { background: #388bfd30; color: #58a6ff; }
  .level-INFO  { background: #23863630; color: #3fb950; }
  .level-WARN  { background: #d2992230; color: #d29922; }
  .level-ERROR { background: #da363330; color: #f85149; }
  .tag { background: #30363d; color: #a5d6ff; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
  .msg { color: #c9d1d9; }
  .data-cell { color: #8b949e; font-size: 11px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .data-cell:hover { color: #58a6ff; }
  .data-expanded { background: #010409; color: #79c0ff; padding: 8px 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, Consolas, monospace; }

  .wrap { flex: 1; overflow: auto; }
  .sel { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>📋 BFF 日志 &nbsp;<span><span class="dot off"></span><span class="count">连接中…</span></span></h1>

  <div class="seg">
    <button class="active" data-level="ALL">全部</button>
    <button data-level="DEBUG">DEBUG</button>
    <button data-level="INFO">INFO</button>
    <button data-level="WARN">WARN</button>
    <button data-level="ERROR">ERROR</button>
  </div>

  <select id="tagFilter">
    <option value="">所有模块</option>
  </select>

  <input id="search" placeholder="🔍 搜索 message / requestId…">
  <button id="autoScroll" class="active">📜 自动滚动</button>
  <button id="clear">🗑️ 清空</button>
  <span id="count" class="count">0 条</span>
</div>

<div class="wrap">
<table>
  <thead><tr>
    <th style="width:120px">时间</th>
    <th style="width:55px">级别</th>
    <th style="width:120px">模块</th>
    <th>消息</th>
    <th style="width:260px">数据</th>
    <th style="width:200px">requestId</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

<script>
const rowsEl = document.getElementById('rows')
const countEl = document.getElementById('count')
const dotEl = document.querySelector('.dot')
const statusLabel = dotEl.parentElement.querySelector('.count')

let autoScroll = true
let currentLevel = 'ALL'
let currentTag = ''
let currentSearch = ''
let records = []          // 所有日志
let recordIds = new Set() // 去重用

document.getElementById('autoScroll').onclick = (e) => {
  autoScroll = !autoScroll; e.currentTarget.classList.toggle('active', autoScroll)
}
document.getElementById('clear').onclick = () => {
  rowsEl.innerHTML = ''; records = []; recordIds.clear(); updateCount()
}
document.getElementById('search').oninput = (e) => { currentSearch = e.target.value.toLowerCase(); rerender() }
document.getElementById('tagFilter').onchange = (e) => { currentTag = e.target.value; rerender() }

document.querySelectorAll('[data-level]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-level]').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentLevel = btn.dataset.level; rerender()
  }
})

function time(iso) {
  const d = new Date(iso)
  const pad = n => n.toString().padStart(2, '0')
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${d.getMilliseconds().toString().padStart(3,'0')}`
}

function formatData(data) {
  if (data === undefined || data === null) return ''
  try {
    return JSON.stringify(data)
  } catch { return String(data) }
}

function updateCount() { countEl.textContent = `${records.length} 条` }

function shouldShow(r) {
  if (currentLevel !== 'ALL' && r.level !== currentLevel) return false
  if (currentTag && r.tag !== currentTag) return false
  if (currentSearch) {
    const s = currentSearch
    if ((r.message || '').toLowerCase().includes(s)) return true
    if ((r.tag || '').toLowerCase().includes(s)) return true
    if ((r.requestId || '').toLowerCase().includes(s)) return true
    const d = formatData(r.data).toLowerCase()
    if (d.includes(s)) return true
    return false
  }
  return true
}

function addRow(r, flash) {
  const tr = document.createElement('tr')
  if (flash) tr.className = 'new'
  const dataStr = formatData(r.data)
  tr.innerHTML = `
    <td>${time(r.time)}</td>
    <td><span class="level level-${r.level}">${r.level}</span></td>
    <td><span class="tag">${r.tag}</span></td>
    <td class="msg">${r.message || ''}</td>
    <td class="data-cell" title="${dataStr}">${dataStr}</td>
    <td style="color:#8b949e">${r.requestId ? r.requestId.slice(0, 8) + '…' : '—'}</td>
  `
  // 点击数据列展开
  const dataTd = tr.querySelector('.data-cell')
  if (dataStr) {
    dataTd.onclick = () => {
      const expanded = tr.querySelector('.data-expanded')
      if (expanded) { expanded.remove() }
      else {
        const fullRow = document.createElement('tr')
        fullRow.innerHTML = `<td colspan="6" class="data-expanded">${escapeHtml(dataStr)}</td>`
        tr.after(fullRow)
      }
    }
  }
  rowsEl.prepend(tr)
  while (rowsEl.children.length > 800) rowsEl.removeChild(rowsEl.lastChild)
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

function rerender() {
  rowsEl.innerHTML = ''
  for (const r of records) if (shouldShow(r)) addRow(r, false)
}

function refreshTags() {
  fetch('/api/logs/tags').then(r => r.json()).then(tags => {
    const sel = document.getElementById('tagFilter')
    const current = sel.value
    sel.innerHTML = '<option value="">所有模块</option>' + tags.map(t => `<option value="${t}">${t}</option>`).join('')
    sel.value = current
  }).catch(() => {})
}

function connectSSE() {
  const es = new EventSource('/api/logs/stream')
  es.onopen = () => { dotEl.className = 'dot live'; statusLabel.textContent = '实时 🔴' }
  es.onmessage = (ev) => {
    if (ev.data.startsWith(':')) return
    let r; try { r = JSON.parse(ev.data) } catch { return }
    if (recordIds.has(r.id)) return
    recordIds.add(r.id)
    records.push(r)
    if (records.length > 5000) { records.shift(); recordIds.delete(records[0]?.id) }
    updateCount()
    refreshTags()
    if (shouldShow(r)) addRow(r, true)
    if (autoScroll) document.querySelector('.wrap').scrollTop = 0
  }
  es.onerror = () => {
    dotEl.className = 'dot off'; statusLabel.textContent = '断开，自动重连…'
    setTimeout(connectSSE, 2000)
  }
}

// 先拉历史，再开 SSE
fetch('/api/logs?limit=800')
  .then(r => r.json())
  .then(list => {
    records = list.reverse()
    for (const r of records) recordIds.add(r.id)
    rerender(); updateCount(); refreshTags()
    connectSSE()
  })
  .catch(() => { statusLabel.textContent = '历史加载失败'; connectSSE() })
</script>
</body>
</html>
