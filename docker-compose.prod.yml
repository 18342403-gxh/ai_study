# ─────────────────────────────────────────────────────────────
#  AI Study · 生产 Docker Compose
#  用法：sudo docker compose up -d --build
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不对外暴露 5432，只在 compose 网络内通
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER} -d ${PG_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ai-study-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_MODEL_LARGE: ${AI_MODEL_LARGE}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DISABLE_EMBEDDING_FALLBACK: ${DISABLE_EMBEDDING_FALLBACK:-1}
      # 超管首次启动初始化（数据库只保存 scrypt 哈希）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 不提供默认值：缺失时直接报错，避免弱口令进入生产
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 未设置}
      TEMP_ACCOUNT_TTL_HOURS: ${TEMP_ACCOUNT_TTL_HOURS:-24}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-7}
      ALLOW_PUBLIC_TEMP_APPLY: ${ALLOW_PUBLIC_TEMP_APPLY:-true}
      TZ: Asia/Shanghai
    volumes:
      # 文档上传持久化
      - uploaddata:/app/apps/server/uploads
      - logdata:/app/logs
      # scripts 从服务器源目录挂载，方便热更新（init-pg.mts 等可能 untracked）
      - ./apps/server/scripts:/app/apps/server/scripts:ro
    # Nginx 反代后只绑定本地回环，不对外暴露
    ports:
      - "127.0.0.1:3001:3001"
    # hoisted 模式下 tsx 在根 node_modules/.bin/
    command: >
      sh -c "/app/node_modules/.bin/tsx scripts/init-pg.mts && node dist/src/index.js"

  generator:
    build:
      context: .
      dockerfile: apps/generator/Dockerfile
      args:
        # BFF_URL 是 Nuxt build-time 常量（runtimeConfig.public.bffUrl）
        # 配 Nginx 后指向同域 80 端口，浏览器走 /api/ 同域免 CORS
        BFF_URL: ${BFF_URL}
    container_name: ai-study-generator
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3003
      BFF_URL: ${BFF_URL}
      # Nuxt 运行时覆盖 public.bffUrl（改 .env 后重启即生效，无需 rebuild）
      NUXT_PUBLIC_BFF_URL: ${BFF_URL}
      TZ: Asia/Shanghai
    # Nginx 反代后只绑定本地回环，不对外暴露
    ports:
      - "127.0.0.1:3003:3003"

volumes:
  pgdata:
  uploaddata:
  logdata:
