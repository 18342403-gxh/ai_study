name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format --check

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build All Apps
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package first
        run: pnpm --filter @ai-study/shared build

      - name: Build all apps
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            apps/server/dist/
            apps/generator/.output/
          if-no-files-found: ignore

  test:
    name: Unit Tests (vitest)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai_study
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: ai_study
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ai_study -d ai_study"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests on PostgreSQL
        working-directory: apps/server
        run: npx vitest run --pool=forks
        env:
          TEST_DATABASE_URL: postgresql://ai_study:123456@localhost:5432/ai_study_test
          ENABLE_MOCK_EMBEDDING: '1'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/server/coverage/
          if-no-files-found: ignore

  audit:
    name: Security Audit
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只报告 high + critical，不 block pipeline
      - name: Dependency audit
        run: 'pnpm audit --audit-level=high || echo "AUDIT_FINDINGS: see report above"'
        continue-on-error: true
